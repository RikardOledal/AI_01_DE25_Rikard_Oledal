[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-01-de25-rikard-oledal"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dlt[duckdb]>=1.32.0",
    "duckdb>=1.5.6",
    "fastapi>=0.162.0",
    "ipykernel>=7.4.0",
    "pandas>=3.1.0",
    "pydantic-ai>=2.63.0",
    "python-dotenv>=1.2.4",
    "streamlit>=1.66.1",
    "uvicorn>=0.54.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["aimodules*"]
